[package]
name = "frontend"
edition = "2021"
publish = false

[dependencies]
glam = { workspace = true }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-web = "0.1.3"
petgraph = { workspace = true }
bounce = { workspace = true, features = ["query", "helmet"] }
stylist = { git = "https://github.com/WorldSEnder/stylist.git", branch = "name-lint", features = ["yew_integration", "yew_use_media_query"] }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = ["MouseEvent"] }
yew = { workspace = true, features = ["hydration"] }
yew-autoprops = "0.4.1"
